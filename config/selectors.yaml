login:
  username_input: "#user_login"
  password_input: "#user_pass"
  submit_button: "#wp-submit"
editor:
  preview_frame: "iframe#elementor-preview-iframe, iframe#iframe-editor-preview, iframe[name='elementor-preview-iframe'], iframe[name='editor-canvas']"
  side_panel: "#elementor-panel"
  widget_type_label: "#elementor-panel-header-title"
  header_title_input: "#elementor-controls input[data-setting='title'], #elementor-controls textarea[data-setting='title']"
  header_weight_select: "#elementor-controls select[data-setting='thegem_heading_weight'], #elementor-controls select[data-setting='title_weight'], #elementor-panel-content-wrapper select[data-setting='thegem_heading_weight'], #elementor-panel-content-wrapper select[data-setting='title_weight']"
  text_editor_visual_tab: "#elementor-panel-content-wrapper [data-elementor-setting='editor'] .elementor-editor-tab-visual, #elementor-panel-content-wrapper .elementor-editor-tab-visual, #elementor-panel-content-wrapper .wp-switch-editor.switch-tmce, #elementor-panel-content-wrapper .wp-switch-editor:has-text('Visual')"
  text_editor_html_tab: "#elementor-panel-content-wrapper [data-elementor-setting='editor'] .elementor-editor-tab-html, #elementor-panel-content-wrapper .elementor-editor-tab-html, #elementor-panel-content-wrapper .wp-switch-editor.switch-html, #elementor-panel-content-wrapper .wp-switch-editor:has-text('C?digo')"
  text_editor_visual_editable: "#elementor-controls .mce-content-body, #elementor-controls [contenteditable='true']"
  text_editor_visual_iframe: "#elementor-controls iframe, #elementor-panel-content-wrapper .elementor-control-editor iframe"
  text_editor_html_textarea: "#elementor-panel-content-wrapper .wp-editor-area, #elementor-controls textarea[data-setting='editor'], #elementor-controls textarea"
  image_content_section_button: "#elementor-controls .elementor-control-section_content .elementor-panel-heading, #elementor-controls button:has-text('Content'), #elementor-controls button:has-text('Contenido')"
  image_replace_button: "#elementor-controls .elementor-control-media__replace, #elementor-controls .elementor-control-media-upload-button"
  style_tab_button: "#elementor-panel-content-wrapper .elementor-tab-control-style, #elementor-panel .elementor-tab-control-style, button:has-text('Estilo'), button:has-text('Style')"
  background_section_button: "#elementor-controls .elementor-control-section_background .elementor-panel-heading, #elementor-panel-content-wrapper .elementor-control-section_background .elementor-panel-heading, button:has-text('Fondo'), button:has-text('Background')"
  background_classic_option: "#elementor-controls .elementor-control-background_background input[value='classic'], #elementor-panel-content-wrapper .elementor-control-background_background input[value='classic'], #elementor-controls .elementor-control-background_background [data-tooltip='Clásico'], #elementor-panel-content-wrapper .elementor-control-background_background [data-tooltip='Clásico']"
  background_image_replace_button: "#elementor-controls .elementor-control-background_image .elementor-control-media__replace, #elementor-panel-content-wrapper .elementor-control-background_image .elementor-control-media__replace"
  media_modal: ".media-modal"
  media_library_tab: ".media-modal .media-menu-item:has-text('Biblioteca multimedia'), #wp-media-modal .media-menu-item:has-text('Biblioteca multimedia'), .media-modal .media-menu-item:has-text('Media Library'), #wp-media-modal .media-menu-item:has-text('Media Library')"
  media_file_input: ".media-modal input[type='file']"
  media_search_input: ".media-modal .media-toolbar-primary.search-form input[type='search'], #wp-media-modal .media-toolbar-primary.search-form input[type='search'], .media-modal input[type='search']"
  media_attachment_items: ".media-modal .attachments .attachment, #wp-media-modal .attachments .attachment"
  media_select_button: ".media-modal .media-button-select, .media-modal button:has-text('Seleccionar')"
  save_button: "button:has-text('Actualizar'), button:has-text('Guardar borrador'), button:has-text('Publicar'), #elementor-panel-saver-button-publish, #elementor-panel-saver-button-save-options, #elementor-panel-saver-button-save-draft"
  save_dropdown_toggle: "#elementor-panel-saver-button-save-options, [aria-label='Guardar opciones'], button:has-text('Guardar opciones')"
  save_draft_action: "#elementor-panel-saver-menu-save-draft, .elementor-panel-menu-item-save-draft, [role='menuitem']:has-text('Guardar borrador'), button:has-text('Guardar borrador')"
  success_toast: ".notice-success, .toast-success, .elementor-toast-message"
